# Runs SignuDoc on Netlify. The app is a regular Next.js server, built by
# Netlify's Next.js runtime. See docs/self-hosting.md, "Self-hosting
# somewhere else", for the settings it needs.
#
# The database is Netlify Database (Postgres from Neon), provisioned by the
# @netlify/database package on the first deploy. It reaches the build and
# the app as NETLIFY_DB_URL, which db/database-url.mjs understands.

[build]
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
